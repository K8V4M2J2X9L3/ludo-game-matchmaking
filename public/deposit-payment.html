<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FriendLudo deposit payment</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #f7f5fb; color: #21152b; font: 15px/1.5 system-ui, sans-serif; }
      .payment { max-width: 460px; margin: auto; padding: 22px; border: 1px dashed #cfc5d7; border-radius: 16px; background: white; text-align: center; }
      .mark { display: grid; width: 52px; height: 52px; margin: 0 auto 12px; place-items: center; border-radius: 16px; background: #f0e7f6; color: #32123e; font-size: 26px; }
      h1 { margin: 0 0 6px; font-size: 19px; }
      p { margin: 0; color: #6f6476; }
      .amount { margin: 18px 0; color: #16865c; font-size: 30px; font-weight: 800; }
      code { display: block; margin-top: 15px; padding: 10px; border-radius: 8px; background: #f7f5fb; color: #7a318f; }
      small { display: block; margin-top: 14px; color: #93899a; }
    </style>
  </head>
  <body>
    <!-- Replace this file with your own payment HTML. Keep reading the `amount` query parameter if needed. -->
    <main class="payment">
      <div class="mark">₹</div>
      <h1>Payment page placeholder</h1>
      <p>Add your UPI QR, bank details, or payment gateway HTML in this file.</p>
      <div class="amount" id="paymentAmount">₹0</div>
      <code>public/deposit-payment.html</code>
      <small>After paying, return to the form below and enter the payment reference.</small>
    </main>
    <script>
      const amount = new URLSearchParams(window.location.search).get('amount') || '0';
      document.getElementById('paymentAmount').textContent = `₹${amount}`;
    </script>
  </body>
</html>
